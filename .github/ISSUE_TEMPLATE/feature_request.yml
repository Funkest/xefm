name: Feature request
description: Something XeFM should be able to do.
labels: [feature]
body:
  - type: markdown
    attributes:
      value: |
        English or Japanese are both fine (日本語でも大丈夫です).
        A change that needs a design discussion first is better started in [Ideas](https://github.com/crftwr/xefm/discussions/categories/ideas).
  - type: textarea
    id: goal
    attributes:
      label: What you want to do
      description: The task you are trying to get done, not only the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: In XeFM, in another file manager, or outside a file manager.
  - type: textarea
    id: proposal
    attributes:
      label: What you would like XeFM to do
    validations:
      required: true
  - type: dropdown
    id: extension
    attributes:
      label: Could it be an extension?
      description: Many features can live outside the core as an [extension package](https://github.com/crftwr/xefm/wiki/Extensions).
      options:
        - Not sure
        - Yes — I am happy to see it as an extension
        - No — it needs a change in XeFM itself
        - I have written it as an extension or config.py code (link below)
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, links, a gist with your config.py code.
